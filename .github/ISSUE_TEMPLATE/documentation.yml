name: 📝 文档改进 | Documentation
description: 修正或补充文档、图表、示例 Fix or extend docs, diagrams, examples
title: "[Docs]: "
labels: ["documentation", "status:needs-triage"]
body:
  - type: dropdown
    id: location
    attributes:
      label: 文档位置 | Document Location
      options:
        - "根 README.md 项目总览 Repository overview"
        - "docs/architecture.md 架构设计 Architecture"
        - "docs/developer-guide.md 开发者指南 Developer guide"
        - "docs/visualization-spec.md 可视化规范 Visualization spec"
        - "docs/evolution-plan.md 演进方案 Evolution plan"
        - "docs/CICD.md 流水线 CI/CD"
        - "docs/LABELS.md 标签规范 Labels"
        - "docs/RELEASE.md 发布流程 Release"
        - "docs/STYLE-GUIDE.md 风格指南 Style guide"
        - "治理文档 贡献/安全/行为准则 Contributing/Security/CoC"
        - "模块 README 协作服务端/可视化 Module README"
        - "其它 Other"
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 类型 | Kind
      options:
        - 内容错误 Factual error
        - 死链 / 格式 Dead link / formatting
        - 与代码不一致 Out of sync with code
        - 缺失内容（模块/流程/示例）Missing content
        - 图表更新 Diagram update
        - 其他 Other
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 具体说明 | Details
      description: 文档路径 + 问题描述 + 建议修改 Doc path + issue + suggested change
    validations:
      required: true
