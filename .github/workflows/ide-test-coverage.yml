/**
 * @file: .github/workflows/ide-test-coverage.yml
 * @description: GitHub Actions CI — 测试+覆盖率+构建+安全扫描+部署（Phase 1 闭环）
 * @author: YanYuCloudCube Team <admin@0379.email>
 * @version: v2.0.0
 * @created: 2026-08-19
 * @updated: 2026-08-28
 * @status: active
 * @tags: [ci,github-actions,test,coverage,build,security,deploy]
 *
 * brief: Phase 1 生产闭环 CI——测试矩阵 + 安全审计 + 构建产物 + 部署
 *
 * security:
 * - 所有 actions 使用 commit SHA 固定（审计 R4）
 * - 顶层 permissions: contents: read（最小权限）
 * - workflow_dispatch 输入经 env 传递（不直接内插 bash）
 */

name: IDE · CI Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "ide/**"
      - ".github/workflows/ide-test-coverage.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "ide/**"
      - ".github/workflows/ide-test-coverage.yml"
  workflow_dispatch:
    inputs:
      test_file_pattern:
        description: "仅跑匹配文件 (留空=全部)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ide
    shell: bash

jobs:
  # ==============================================================
  # Job 1: 安全审计（新增 Phase 1 P1-8）
  # ==============================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.1.0
        with:
          node-version: 22.x
          cache: "pnpm"
          cache-dependency-path: "ide/pnpm-lock.yaml"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run pnpm audit (production only)
        run: |
          # 只检查生产依赖漏洞（dev 依赖不影响运行时安全）
          AUDIT=$(pnpm audit --prod 2>&1) || true
          echo "$AUDIT"
          if echo "$AUDIT" | grep -q "critical\|high"; then
            echo "❌ Critical or High severity vulnerabilities found in production dependencies"
            exit 1
          fi
          echo "✅ No critical/high vulnerabilities in production dependencies"

  # ==============================================================
  # Job 2: 单元测试 + 覆盖率 (矩阵)
  # ==============================================================
  test-and-coverage:
    name: Test & Coverage · Node ${{ matrix.node-version }}
    needs: security-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]
        exclude:
          - os: macos-latest
            node-version: 18.x
          - os: macos-latest
            node-version: 20.x

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: "ide/pnpm-lock.yaml"

      - name: Enable corepack & install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Vitest with coverage (gate)
        env:
          TEST_ENV: ci
          CI: true
          TEST_PATTERN: ${{ github.event.inputs.test_file_pattern }}
        run: |
          if [ -n "$TEST_PATTERN" ]; then
            echo "🎯 手动触发，仅运行匹配文件: $TEST_PATTERN"
            pnpm vitest run "$TEST_PATTERN" --coverage
          else
            echo "🚀 完整测试套件 + 覆盖率门禁"
            pnpm test:coverage
          fi

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: coverage-node${{ matrix.node-version }}-${{ matrix.os }}-${{ github.run_number }}
          path: ide/coverage/**
          retention-days: 30
          if-no-files-found: ignore

  # ==============================================================
  # Job 3: 构建生产产物（新增 Phase 1 P1-8）
  # ==============================================================
  build:
    name: Build Production Bundle
    needs: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.1.0
        with:
          node-version: 22.x
          cache: "pnpm"
          cache-dependency-path: "ide/pnpm-lock.yaml"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build production bundle
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: dist-${{ github.run_number }}
          path: ide/dist/**
          retention-days: 7

  # ==============================================================
  # Job 4: 覆盖率 PR 评论
  # ==============================================================
  coverage-summary:
    name: Coverage Summary & PR Comment
    needs: test-and-coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download coverage artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: coverage-node20.x-ubuntu-latest-*
          merge-multiple: true
          path: _coverage_tmp

      - name: Parse coverage summary
        id: parse
        run: |
          JSON_FILE="_coverage_tmp/coverage-final.json"
          if [ ! -f "$JSON_FILE" ]; then
            echo "coverage_not_found=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("_coverage_tmp/coverage-final.json","utf8"));
            for (const [filePath, fileData] of Object.entries(data)) {
              if (filePath.endsWith("services/agent/AgentSkills.ts")) {
                const s = fileData.summary || {};
                process.stdout.write(`AGENT_STMTS=${s.lines?.pct ?? "N/A"}\n`);
                process.stdout.write(`AGENT_BRANCH=${s.branches?.pct ?? "N/A"}\n`);
                process.stdout.write(`AGENT_FUNCS=${s.functions?.pct ?? "N/A"}\n`);
              }
            }
          ' >> $GITHUB_OUTPUT || true

      - name: Comment PR with coverage badges
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        if: steps.parse.outputs.coverage_not_found != 'true'
        with:
          script: |
            const body = `### 📊 IDE 覆盖率报告 (AgentSkills 专项)

            | 指标 | 实际值 | 阈值 | 状态 |
            |------|--------|------|------|
            | 🟦 Statements | **${{ steps.parse.outputs.AGENT_STMTS }}%** | ≥ 90% | ${{ (parseFloat(steps.parse.outputs.AGENT_STMTS) >= 90) ? '✅' : '❌' }} |
            | 🟩 Branches   | **${{ steps.parse.outputs.AGENT_BRANCH }}%** | ≥ 85% | ${{ (parseFloat(steps.parse.outputs.AGENT_BRANCH) >= 85) ? '✅' : '❌' }} |
            | 🟪 Functions  | **${{ steps.parse.outputs.AGENT_FUNCS }}%** | ≥ 95% | ${{ (parseFloat(steps.parse.outputs.AGENT_FUNCS) >= 95) ? '✅' : '❌' }} |

            📎 完整报告: Actions Artifact → 下载 \`coverage-*\` 查看
            > Run: #${{ github.run_number }} · Commit: \`${{ github.event.pull_request.head.sha }}\`
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

  # ==============================================================
  # Job 5: 最终状态
  # ==============================================================
  final-status:
    name: CI Status Summary
    needs: [security-audit, test-and-coverage, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        if: needs.security-audit.result != 'success' || needs.test-and-coverage.result != 'success' || needs.build.result != 'success'
        run: exit 1
      - name: All gates passed 🎉
        run: echo "✅ IDE CI Pipeline — security + tests + build all green"
