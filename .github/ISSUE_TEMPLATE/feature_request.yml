name: ✨ 功能请求 | Feature Request
description: 提出新功能或改进建议 Propose a new feature or improvement
title: "[Feature]: "
labels: ["feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        描述清楚「问题」与「价值」，比描述「方案」更重要。
        A clear problem & value statement matters more than a solution sketch.

  - type: dropdown
    id: module
    attributes:
      label: 目标模块 | Target Module
      options:
        - "mod:workbench 多文件编辑 Workbench"
        - "mod:panel-host 面板宿主 Panel host"
        - "mod:agent Agent 编排与市场 Agent"
        - "mod:terminal 终端与沙箱 Terminal & sandbox"
        - "mod:visualization 可视化体系 Visualization"
        - "mod:model-settings 模型设置 Model settings"
        - "mod:plugins 插件系统 Plugins"
        - "mod:snapshot 快照 Diff Snapshot"
        - "mod:mcp MCP 服务栈 MCP"
        - "mod:llm LLM 调用层 LLM"
        - "mod:context 上下文工程 Context engineering"
        - "mod:security 安全套件 Security"
        - "mod:storage 存储与状态 Storage & stores"
        - "mod:collab 协作 Collab"
        - "mod:electron 桌面端 Electron"
        - "mod:infra 基础设施 Infra"
        - "mod:docs 文档 Docs"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 问题 / 动机 | Problem & Motivation
      description: 当前哪里不方便或不完整 What is missing or painful today
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 | Proposed Solution
      description: 期望的行为与大致实现思路 Desired behavior & rough approach
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 | Alternatives Considered

  - type: checkboxes
    id: ack
    attributes:
      label: 确认 | Acknowledgement
      options:
        - label: 我已搜索现有 Issue，确认无重复 I have searched existing issues for duplicates
          required: true
