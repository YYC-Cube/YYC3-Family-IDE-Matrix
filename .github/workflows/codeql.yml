# CodeQL 安全扫描 — Phase 2 P2-3 供应链门禁
# 静态分析 JavaScript/TypeScript 代码中的安全漏洞

name: CodeQL Security Scan

on:
  push:
    branches: [main, master]
    paths:
      - "ide/**"
  pull_request:
    branches: [main, master]
    paths:
      - "ide/**"
  schedule:
    # 每周一 UTC 00:00 定期扫描
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e8fbbc45f8b13b5c16d5a01ea249c88e5b94a # v3.28.16
        with:
          languages: ${{ matrix.language }}
          # 安全查询套件：安全漏洞 + 代码质量
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@4e8fbbc45f8b13b5c16d5a01ea249c88e5b94a # v3.28.16

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4e8fbbc45f8b13b5c16d5a01ea249c88e5b94a # v3.28.16
        with:
          category: "/language:${{ matrix.language }}"
          # 上传 SARIF 到 GitHub Security tab
          output: sarif-results
          upload: true
