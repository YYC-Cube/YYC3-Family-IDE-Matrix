# YYC³ Matrix proxyAdapter 路由翻译（nginx envsubst 模板）
#
# Matrix proxyFetch 请求形状（ide/ProxyService.ts）:
#   POST {base}/{providerId}{endpoint}      e.g. /api/proxy/zai-plan/v1/chat/completions
#   头:   X-Proxy-Auth: {authToken}          （可选前端→代理认证）
#   健康探测: GET {base}/health
#
# 本配置完成三件事:
#   1. 剥离 providerId 段 → new-api OpenAI 兼容路径
#   2. 服务端注入 Authorization（浏览器零密钥）
#   3. SSE 流式透传（smartChatCompletionStream 支持）

server {
    listen 3001;
    server_name _;

    # ── 健康检查：对齐 new-api /api/status ──
    location = /api/proxy/health {
        proxy_pass http://${NEW_API_UPSTREAM}/api/status;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── LLM 请求：/{providerId}/... → /...（new-api 令牌鉴权）──
    location ~ ^/api/proxy/[^/]+/(.*)$ {
        # 前端→代理认证（PROXY_AUTH_TOKEN 为空时跳过校验）
        if ($http_x_proxy_auth ~* "^$") {
            set $auth_check "skip";
        }
        # 令牌校验交由 nginx map（下方）+ new-api 二次鉴权
        proxy_pass http://${NEW_API_UPSTREAM}/$1$is_args$args;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 密钥注入 — NEW_API_KEY 为 new-api 后台创建的系统令牌
        proxy_set_header Authorization "Bearer ${NEW_API_KEY}";
        # 剥离前端认证头，不外泄
        proxy_set_header X-Proxy-Auth "";

        # SSE 流式支持（chat/completions stream=true）
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 请求体上限（长上下文保护）
        client_max_body_size 8m;
    }

    # 其余路径一律 404
    location / {
        return 404;
    }
}
